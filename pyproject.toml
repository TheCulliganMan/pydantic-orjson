[project]
name = "orjson"
version = "3.13.0+pydantic.3"
repository = "https://github.com/TheCulliganMan/pydantic-orjson"
description = "orjson-compatible native JSON with optional Pydantic and Pydantic AI adapters"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
readme = "README.md"
license = "MPL-2.0 AND (Apache-2.0 OR MIT)"

[project.urls]
source = "https://github.com/TheCulliganMan/pydantic-orjson"
documentation = "https://github.com/TheCulliganMan/pydantic-orjson/blob/main/PLAN.md"
changelog = "https://github.com/TheCulliganMan/pydantic-orjson/blob/main/FORK_CHANGELOG.md"
upstream = "https://github.com/ijl/orjson"

[project.optional-dependencies]
pydantic = ["pydantic>=2.14.4,<3"]
ai = ["pydantic>=2.14.4,<3", "pydantic-ai-slim>=2.73,<3"]

[build-system]
build-backend = "maturin"
requires = ["maturin>=1,<2"]

[tool.maturin]
python-source = "pysrc"
include = [
    { format = "sdist", path = "PLAN.md" },
    { format = "sdist", path = "FORK_CHANGELOG.md" },
    { format = "sdist", path = "UPSTREAM.md" },
    { format = "sdist", path = "integration_pydantic/**/*" },
    { format = "sdist", path = "compatibility/**/*" },
    { format = "sdist", path = "benchmarks/**/*" },
    { format = "sdist", path = "scripts/**/*" },
    { format = "sdist", path = "requirements-fork.txt" },
    { format = "sdist", path = ".cargo/*" },
    { format = "sdist", path = "build.rs" },
    { format = "sdist", path = "Cargo.lock" },
    { format = "sdist", path = "include/cargo/**/*" },
    { format = "sdist", path = "include/yyjson/**/*" },
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "COM",
    "DTZ",
    "E",
    "EXE",
    "F",
    "FLY",
    "I",
    "ISC",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
    "TCH",
    "TID",
    "UP",
    "W",
]
ignore = [
    "B005", # Using `.strip()` with multi-character strings is misleading
    "COM812", # Trailing comma missing
    "DTZ001", # `datetime.datetime()` called without a `tzinfo` argument
    "DTZ005", # `datetime.datetime.now()` called without a `tz` argument
    "E402", # Module level import not at top of file
    "E501", # line too long
    "F601", # Dictionary key literal ... repeated
    "F821",  # Undefined name `...`. Consider specifying `requires-python = ">= ..."`
    "PIE810", # Call `startswith` once with a `tuple`
    "PLR2004", # Magic value used in comparison
    "RUF061", # Use context-manager form of `pytest.raises()`
    "UP012", # Unnecessary call to encode as UTF-8
]

[tool.pytest]
minversion = "9.0"
strict = true

[tool.ruff.lint.isort]
known-first-party = ["orjson"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["dateutil", "pytz"]
ignore_missing_imports = true
