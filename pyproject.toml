[project]
name = "orjson"
version = "3.13.0+pydantic.3"
repository = "https://github.com/TheCulliganMan/pydantic-orjson"
description = "orjson-compatible native JSON with optional Pydantic and Pydantic AI adapters"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
readme = "README.md"
license = "MPL-2.0 AND (Apache-2.0 OR MIT)"

[project.urls]
source = "https://github.com/TheCulliganMan/pydantic-orjson"
documentation = "https://github.com/TheCulliganMan/pydantic-orjson/blob/main/PLAN.md"
changelog = "https://github.com/TheCulliganMan/pydantic-orjson/blob/main/FORK_CHANGELOG.md"
upstream = "https://github.com/ijl/orjson"

[project.optional-dependencies]
pydantic = ["pydantic>=2.14.4,<3"]
# Pydantic AI requires Python 3.11+. The marker keeps the universal uv lock
# compatible with the native package and Pydantic-only helpers on Python 3.10.
ai = ["pydantic>=2.14.4,<3", "pydantic-ai-slim>=2.73,<3; python_version >= '3.11'"]

[build-system]
build-backend = "maturin"
requires = ["maturin==1.16.0"]

# Test/tool versions are declared here; uv.lock records all transitive versions
# and artifacts. Older interpreter branches retain compatible dependencies.
[dependency-groups]
native-common = [
    "faker==40.63.0",
    "maturin==1.16.0",
    "pendulum==3.3.0",
    "psutil==7.2.2",
    "pytest==9.2.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.6",
    "ruff==0.17.6",
    "tomli==2.5.0; python_version < '3.11'",
]
native = [
    { include-group = "native-common" },
    "hypothesis==6.151.9; python_version < '3.11'",
    "hypothesis==6.170.17; python_version >= '3.11'",
    "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.3.5; python_version >= '3.11' and python_version < '3.12'",
    "numpy==2.5.5; python_version >= '3.12'",
    "pandas==2.3.3; python_version < '3.11'",
    "pandas==3.1.1; python_version >= '3.11'",
    "pyperf==2.9.0; python_version < '3.11'",
    "pyperf==2.11.0; python_version >= '3.11'",
]
# Current optional integration wheels require 3.14t+. Keep native 3.13t
# qualification on published wheels; do not override dependency build guards.
native313t = [
    { include-group = "native-common" },
    "hypothesis==6.151.9",
    "numpy==2.3.5",
    # pandas 2.3.3 publishes 3.13t wheels for Linux/macOS, not Windows.
    "pandas==2.3.3; sys_platform != 'win32'",
    "pyperf==2.11.0",
]
integration = [
    "pydantic==2.14.4",
    "pydantic-ai-slim==2.73.0; python_version >= '3.11'",
    "fastapi==0.165.0; python_version >= '3.11'",
    "httpx==0.28.1; python_version >= '3.11'",
]
dev = [{ include-group = "native" }, { include-group = "integration" }]

[tool.uv]
required-version = ">=0.13.9"
default-groups = []
conflicts = [
    [{ group = "native313t" }, { group = "native" }],
    [{ group = "native313t" }, { group = "integration" }],
    [{ group = "native313t" }, { group = "dev" }],
    [{ group = "native313t" }, { extra = "pydantic" }],
    [{ group = "native313t" }, { extra = "ai" }],
]

[tool.uv.dependency-groups]
native313t = { requires-python = ">=3.13,<3.14" }

[tool.maturin]
python-source = "pysrc"
include = [
    { format = "sdist", path = "PLAN.md" },
    { format = "sdist", path = "FORK_CHANGELOG.md" },
    { format = "sdist", path = "UPSTREAM.md" },
    { format = "sdist", path = "integration_pydantic/**/*" },
    { format = "sdist", path = "compatibility/**/*" },
    { format = "sdist", path = "benchmarks/**/*" },
    { format = "sdist", path = "scripts/**/*" },
    { format = "sdist", path = "script/*" },
    { format = "sdist", path = "data/**/*" },
    { format = "sdist", path = "VALIDATION.md" },
    { format = "sdist", path = "uv.lock" },
    { format = "sdist", path = ".python-version" },
    { format = "sdist", path = ".cargo/*" },
    { format = "sdist", path = "build.rs" },
    { format = "sdist", path = "Cargo.lock" },
    { format = "sdist", path = "include/cargo/**/*" },
    { format = "sdist", path = "include/yyjson/**/*" },
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.DS_Store"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "COM",
    "DTZ",
    "E",
    "EXE",
    "F",
    "FLY",
    "I",
    "ISC",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
    "TCH",
    "TID",
    "UP",
    "W",
]
ignore = [
    "B005", # Using `.strip()` with multi-character strings is misleading
    "COM812", # Trailing comma missing
    "DTZ001", # `datetime.datetime()` called without a `tzinfo` argument
    "DTZ005", # `datetime.datetime.now()` called without a `tz` argument
    "E402", # Module level import not at top of file
    "E501", # line too long
    "F601", # Dictionary key literal ... repeated
    "F821",  # Undefined name `...`. Consider specifying `requires-python = ">= ..."`
    "PIE810", # Call `startswith` once with a `tuple`
    "PLR2004", # Magic value used in comparison
    "RUF061", # Use context-manager form of `pytest.raises()`
    "UP012", # Unnecessary call to encode as UTF-8
]

[tool.pytest]
minversion = "9.0"
strict = true

[tool.ruff.lint.isort]
known-first-party = ["orjson"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["dateutil", "pytz"]
ignore_missing_imports = true
