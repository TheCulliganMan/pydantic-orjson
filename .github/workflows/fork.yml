name: Fork compatibility
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: macos-15, python: '3.13'}
          - {os: windows-2025, python: '3.13'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup default 1.99.0
      - run: python -m pip install -r requirements-fork.txt
      - run: python script/check-version
      - run: maturin build --release --strip --locked --out dist
        env:
          # Match upstream Windows builds: private CPython symbols need the
          # full import library, beyond pyo3-ffi's raw-dylib declarations.
          PYO3_USE_RAW_DYLIB: '0'
      - name: Install wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl
      - run: python -m pytest -q test compatibility integration_pydantic
      - run: ruff check pysrc/orjson/pydantic.py pysrc/orjson/pydantic_ai.py compatibility integration_pydantic benchmarks scripts
      - run: ruff format --check pysrc/orjson/pydantic.py pysrc/orjson/pydantic_ai.py compatibility integration_pydantic benchmarks scripts

  core-python310:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup default 1.99.0
      - run: python -m pip install 'maturin>=1.10,<2' -r test/requirements.txt
      - run: maturin build --release --strip --locked --out dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest -q test
