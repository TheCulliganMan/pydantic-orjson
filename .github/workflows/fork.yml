name: Fork compatibility
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: ubuntu-24.04, python: '3.15'}
          - {os: macos-15, python: '3.13'}
          - {os: windows-2025, python: '3.13'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup default 1.99.0
      - run: python -m pip install -r requirements-fork.txt
      - run: python script/check-version
      - run: maturin build --release --strip --locked --out dist
        env:
          # Match upstream Windows builds: private CPython symbols need the
          # full import library, beyond pyo3-ffi's raw-dylib declarations.
          PYO3_USE_RAW_DYLIB: '0'
      - name: Install wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl
      - run: python -m pytest -q test compatibility integration_pydantic
        env:
          PYTHONMALLOC: debug
      - run: ruff check pysrc/orjson/pydantic.py pysrc/orjson/pydantic_ai.py compatibility integration_pydantic benchmarks scripts
      - run: ruff format --check pysrc/orjson/pydantic.py pysrc/orjson/pydantic_ai.py compatibility integration_pydantic benchmarks scripts

  older-python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup default 1.99.0
      - run: python -m pip install 'maturin>=1.10,<2' -r test/requirements.txt
      - run: maturin build --release --strip --locked --out dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest -q test
        env:
          PYTHONMALLOC: debug
      - name: Typed integration on older supported Python
        if: matrix.python != '3.10'
        run: |
          python -m pip install 'pydantic==2.14.4' 'pydantic-ai-slim==2.73.0' 'fastapi==0.165.0' 'httpx==0.28.1' numpy hypothesis
          python -m pytest -q compatibility integration_pydantic
        env:
          PYTHONMALLOC: debug
      - name: Pydantic core integration on Python 3.10
        if: matrix.python == '3.10'
        run: |
          python -m pip install 'pydantic==2.14.4'
          python -m pytest -q integration_pydantic/test_codec.py integration_pydantic/test_semantics.py

  free-threaded:
    name: Linux / Python ${{ matrix.python }} / no GIL
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13t', '3.14t', '3.15t']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup default 1.99.0
      - run: python -m pip install -r requirements-fork.txt
      - run: maturin build --release --strip --locked --out dist
      - run: python -m pip install dist/*.whl
      - name: Require default import to keep the GIL disabled
        run: python -I -c "import sys; assert not sys._is_gil_enabled(); import orjson; assert not sys._is_gil_enabled()"
      - run: python -X faulthandler -m pytest -q test compatibility integration_pydantic
        env:
          PYTHON_GIL: '0'
          PYTHONMALLOC: debug
