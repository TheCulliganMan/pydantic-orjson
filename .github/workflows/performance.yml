name: Source build engineering comparison
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.runner }} / ${{ matrix.baseline }} baseline
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        baseline: [source, published]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PERF_BASELINE_KIND: ${{ matrix.baseline }}
      PERF_SOURCE_BASE: e56965ebcfdc1905318da14d37b8b07990130109
      UV_MANAGED_PYTHON: '1'
      UV_PROJECT_ENVIRONMENT: .venv
      UV_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.9'
          enable-cache: true
      - run: uv python install 3.13
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup default 1.99.0
      - name: Build candidate and prepare the selected baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/perf results
          git rev-parse HEAD > results/candidate-commit.txt
          rustc --version --verbose > results/rustc.txt
          uv --version > results/uv.txt
          # Both environments use this checkout's same lock, not the historical
          # source checkout's dependency declarations. Only orjson differs.
          for environment in .artifacts/perf/baseline .venv; do
            UV_PROJECT_ENVIRONMENT="$environment" uv sync --locked --no-install-project --python 3.13 --group native --group integration
          done
          uv run --no-sync python -c 'from importlib.metadata import version; print("maturin==" + version("maturin"))' > .artifacts/perf/build-constraints.txt

          if [[ "$PERF_BASELINE_KIND" == source ]]; then
            mkdir -p .artifacts/perf/source
            git archive "$PERF_SOURCE_BASE" | tar -x -C .artifacts/perf/source
            printf '%s\n' "$PERF_SOURCE_BASE" > results/baseline-source-commit.txt
            uv build .artifacts/perf/source --wheel --no-sources --python .artifacts/perf/baseline --build-constraints .artifacts/perf/build-constraints.txt -C 'maturin.build-args=--locked --strip' --out-dir .artifacts/perf/baseline-wheels 2>&1 | tee results/build-baseline.txt
            uv pip install --python .artifacts/perf/baseline --no-deps --reinstall .artifacts/perf/baseline-wheels/*.whl
          else
            # Fail if the official platform wheel is unavailable; do not silently
            # substitute another locally compiled source build for this control.
            uv pip install --python .artifacts/perf/baseline --default-index https://pypi.org/simple --only-binary=:all: --no-deps --reinstall --verbose 'orjson==3.13.0' 2>&1 | tee results/baseline-install.log
            # UV has no pip --report equivalent. Retain the download log and
            # installed wheel metadata/native hash as the provenance receipt.
            UV_PROJECT_ENVIRONMENT=.artifacts/perf/baseline uv run --no-sync python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          from pathlib import Path

          dist = importlib.metadata.distribution("orjson")
          native = [path for path in dist.files if str(path).endswith((".so", ".pyd"))]
          assert len(native) == 1, native
          native_path = dist.locate_file(native[0])
          receipt = {
              "requested": "orjson==3.13.0",
              "index": "https://pypi.org/simple",
              "only_binary": True,
              "installed_version": dist.version,
              "wheel_metadata": dist.read_text("WHEEL"),
              "installer": dist.read_text("INSTALLER"),
              "native_sha256": hashlib.sha256(native_path.read_bytes()).hexdigest(),
          }
          assert dist.version == "3.13.0", receipt
          Path("results/baseline-install.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          fi

          uv build --wheel --no-sources --python .venv --build-constraints .artifacts/perf/build-constraints.txt -C 'maturin.build-args=--locked --strip' --out-dir .artifacts/perf/candidate-wheels 2>&1 | tee results/build-candidate.txt
          uv pip install --python .venv --no-deps --reinstall .artifacts/perf/candidate-wheels/*.whl
          for variant in baseline candidate; do
            environment=.venv
            if [[ "$variant" == baseline ]]; then environment=.artifacts/perf/baseline; fi
            uv pip check --python "$environment"
            uv pip freeze --python "$environment" > "results/dependencies-$variant.txt"
          done
          baseline_python=$(UV_PROJECT_ENVIRONMENT=.artifacts/perf/baseline uv run --no-sync python -c 'import sys; print(sys.executable)')
          candidate_python=$(uv run --no-sync python -c 'import sys; print(sys.executable)')
          uv run --no-sync python compatibility/differential.py --baseline "$baseline_python" --candidate "$candidate_python" --output results/compatibility.json

      - name: Select one permitted physical-core representative
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path

          allowed = sorted(os.sched_getaffinity(0))
          cores = {}
          for cpu in allowed:
              topology = Path(f"/sys/devices/system/cpu/cpu{cpu}/topology")
              try:
                  key = (
                      (topology / "physical_package_id").read_text().strip(),
                      (topology / "core_id").read_text().strip(),
                  )
              except OSError:
                  key = ("logical-cpu", str(cpu))
              cores.setdefault(key, cpu)
          # Prefer a core away from CPU 0 when the runner exposes several.
          # Workers remain serial and pinned to this same logical CPU in all runs.
          representatives = list(cores.values())
          selected = representatives[-1]
          Path("results/cpu-selection.json").write_text(json.dumps({
              "allowed_logical_cpus": allowed,
              "physical_core_representatives": representatives,
              "selected_logical_cpu": selected,
          }, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"PERF_CPU={selected}\n")
          PY

      - name: Measure forward and reverse orders on the same CPU
        shell: bash
        run: |
          set -euo pipefail
          group=()
          if [[ "$PERF_BASELINE_KIND" == published ]]; then
            group=(--group dumps.,loads.)
          fi
          measure() {
            local variant="$1" report="$2"
            local environment=.venv
            if [[ "$variant" == baseline ]]; then environment=.artifacts/perf/baseline; fi
            UV_PROJECT_ENVIRONMENT="$environment" uv run --no-sync python benchmarks/pyperf_suite.py "${group[@]}" --affinity "$PERF_CPU" -p 4 -n 4 -w 2 --min-time 0.07 -o "results/$report.json" 2>&1 | tee "results/$report.log"
          }
          measure baseline baseline
          measure candidate candidate
          measure candidate candidate-reverse
          measure baseline baseline-reverse

      - name: Validate metadata and compare both orders
        shell: bash
        run: |
          set -euo pipefail
          selection=()
          if [[ "$PERF_BASELINE_KIND" == published ]]; then
            selection=(--native-only)
          fi
          uv run --no-sync python benchmarks/compare_pyperf.py results/baseline.json results/candidate.json "${selection[@]}" 2>&1 | tee results/comparison.txt
          uv run --no-sync python benchmarks/compare_pyperf.py results/baseline-reverse.json results/candidate-reverse.json "${selection[@]}" 2>&1 | tee results/comparison-reverse.txt
          {
            printf '### %s baseline on %s\n\n' "$PERF_BASELINE_KIND" "$RUNNER_ARCH"
            printf 'Both run orders and raw worker samples are retained in the artifact. '
            printf 'A successful job validates comparability, not a speed acceptance gate. '
            printf 'Shared-runner scheduling and frequency variation still require review.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-${{ matrix.runner }}-${{ matrix.baseline }}
          path: results/
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary environments and build products
        if: always()
        shell: bash
        run: rm -rf .artifacts/perf .venv target
