# SPDX-License-Identifier: (Apache-2.0 OR MIT)
name: Build replacement wheels
on:
  workflow_dispatch:
    inputs:
      variants:
        description: Python ABI variants to build and test
        type: choice
        options: [regular, free-threaded, all]
        default: regular

permissions:
  contents: read

# These are downloadable build artifacts, not a PyPI or GitHub release.
# Every t ABI wheel must import and execute with the GIL disabled.
# UV interpreter selectors: https://docs.astral.sh/uv/concepts/python-versions/#free-threaded-python
# Runtime contract: https://docs.python.org/3/howto/free-threading-extensions.html
jobs:
  wheel:
    name: ${{ matrix.platform.label }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.variants == 'regular' && '["3.10","3.11","3.12","3.13","3.14","3.15"]' || inputs.variants == 'free-threaded' && '["3.13t","3.14t","3.15t"]' || '["3.10","3.11","3.12","3.13","3.14","3.15","3.13t","3.14t","3.15t"]') }}
        platform:
          - {label: linux-x86_64, runner: ubuntu-24.04, architecture: x64}
          - {label: linux-aarch64, runner: ubuntu-24.04-arm, architecture: arm64}
          - {label: macos-x86_64, runner: macos-15-intel, architecture: x64}
          - {label: macos-arm64, runner: macos-15, architecture: arm64}
          - {label: windows-amd64, runner: windows-2025, architecture: x64}
    env:
      UV_MANAGED_PYTHON: '1'
      UV_PROJECT_ENVIRONMENT: .venv
      UV_PYTHON: ${{ endsWith(matrix.python, 't') && matrix.python || format('{0}+gil', matrix.python) }}
      # Private CPython symbols require the full Windows import library.
      PYO3_USE_RAW_DYLIB: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.13.9'
          enable-cache: true
      - name: Install the requested UV-managed interpreter
        run: uv python install "${UV_PYTHON%+gil}"
      - name: Install release toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Sync locked native and framework dependencies
        if: matrix.python != '3.10' && matrix.python != '3.13t'
        run: uv sync --locked --no-install-project --python "$UV_PYTHON" --group native --group integration
      - name: Sync published native dependencies for experimental Python 3.13t
        if: matrix.python == '3.13t'
        # Current Pydantic/AI dependencies do not publish supported 3.13t wheels.
        run: uv sync --locked --no-install-project --no-build --python "$UV_PYTHON" --group native313t
      - name: Sync locked Python 3.10 dependencies
        if: matrix.python == '3.10'
        run: uv sync --locked --no-install-project --python "$UV_PYTHON" --group native --extra pydantic
      - name: Verify selected interpreter
        env:
          REQUESTED_PYTHON: ${{ matrix.python }}
          REQUESTED_ARCHITECTURE: ${{ matrix.platform.architecture }}
        run: |
          uv run --no-sync python - <<'PY'
          import os, platform, sys, sysconfig
          requested = os.environ['REQUESTED_PYTHON']
          actual = f'{sys.version_info.major}.{sys.version_info.minor}'
          threaded = bool(sysconfig.get_config_var('Py_GIL_DISABLED'))
          assert actual == requested.removesuffix('t'), (requested, sys.version)
          assert threaded == requested.endswith('t'), (requested, threaded)
          architecture = {'amd64': 'x64', 'x86_64': 'x64', 'aarch64': 'arm64', 'arm64': 'arm64'}[platform.machine().lower()]
          assert architecture == os.environ['REQUESTED_ARCHITECTURE'], architecture
          print(sys.version)
          print('free-threaded ABI:', threaded)
          PY
          uv run --no-sync python script/check-version
      - name: Build the replacement wheel through UV
        run: |
          build_args='--locked --strip'
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Audit the Ubuntu 24.04 host's actual glibc compatibility;
            # do not relabel a host-built wheel as manylinux2014.
            build_args+=' --compatibility manylinux_2_39'
          fi
          # This fork tests an experimental 3.13t compatibility port. Keep
          # PyO3's normal version guard enabled for every other interpreter.
          if [[ "$UV_PYTHON" == '3.13t' ]]; then
            export UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          fi
          uv build --wheel --no-sources --python .venv -C "maturin.build-args=$build_args" --out-dir dist
      - name: Install exactly the built wheel
        run: uv pip install --python .venv --no-deps --reinstall dist/*.whl
      - name: Verify wheel ABI and runtime GIL state
        env:
          REQUESTED_PYTHON: ${{ matrix.python }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          from packaging.utils import parse_wheel_filename

          requested = os.environ['REQUESTED_PYTHON']
          threaded = requested.endswith('t')
          interpreter = 'cp' + requested.removesuffix('t').replace('.', '')
          abi = interpreter + ('t' if threaded else '')
          wheels = list(pathlib.Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          _, _, _, tags = parse_wheel_filename(wheel.name)
          assert any(tag.interpreter == interpreter and tag.abi == abi for tag in tags), tags
          # With no PYTHON_GIL override, a t interpreter must stay free-threaded
          # after importing the extension. -I isolates imports.
          environment = dict(os.environ)
          environment.pop('PYTHON_GIL', None)
          program = '''
          import json, sys, sysconfig
          before = getattr(sys, '_is_gil_enabled', lambda: True)()
          import orjson
          from pathlib import Path
          assert Path(orjson.__file__).is_relative_to(Path(sys.prefix)), orjson.__file__
          after = getattr(sys, '_is_gil_enabled', lambda: True)()
          threaded = bool(sysconfig.get_config_var('Py_GIL_DISABLED'))
          assert after is not threaded, 'Unexpected GIL state after importing orjson'
          value = {'ready': True, 'items': [1, None, 'snow: 雪']}
          assert orjson.loads(orjson.dumps(value)) == value
          print(json.dumps({'python': sys.version,
                            'free_threaded_abi': bool(sysconfig.get_config_var('Py_GIL_DISABLED')),
                            'gil_before_import': before, 'gil_after_import': after,
                            'native_api_version': orjson.__version__}))
          '''
          import textwrap
          result = subprocess.run([sys.executable, '-I', '-c', textwrap.dedent(program)],
                                  env=environment, text=True, capture_output=True, check=True)
          runtime = json.loads(result.stdout)
          assert runtime['free_threaded_abi'] == threaded
          if threaded:
              assert runtime['gil_before_import'] is False, runtime
          runtime.update(source_sha=os.environ['SOURCE_SHA'], wheel=wheel.name,
                         wheel_sha256=hashlib.sha256(wheel.read_bytes()).hexdigest(),
                         import_stderr=result.stderr,
                         runtime_contract='GIL disabled' if threaded else 'regular CPython GIL')
          pathlib.Path('dist/runtime.json').write_text(json.dumps(runtime, indent=2) + '\n')
          print(json.dumps(runtime, indent=2))
          PY
      - name: Test native API and compatibility boundaries
        env:
          PYTHON_GIL: ${{ endsWith(matrix.python, 't') && '0' || '1' }}
          PYTHONMALLOC: debug
        run: |
          uv run --no-sync python -m pytest -q test compatibility --ignore=compatibility/test_drop_in.py --junitxml=dist/native-tests.xml
      - name: Test Pydantic AI and FastAPI integration
        if: matrix.python != '3.10' && matrix.python != '3.13t'
        env:
          PYTHON_GIL: ${{ endsWith(matrix.python, 't') && '0' || '1' }}
          PYTHONMALLOC: debug
        run: uv run --no-sync python -m pytest -q compatibility/test_drop_in.py integration_pydantic --junitxml=dist/integration-tests.xml
      - name: Test Pydantic on Python 3.10
        if: matrix.python == '3.10'
        env:
          PYTHON_GIL: ${{ endsWith(matrix.python, 't') && '0' || '1' }}
          PYTHONMALLOC: debug
        run: |
          uv run --no-sync python -m pytest -q integration_pydantic/test_codec.py integration_pydantic/test_semantics.py --junitxml=dist/integration-tests.xml
      - name: Verify calls from multiple Python threads
        env:
          PYTHON_GIL: ${{ endsWith(matrix.python, 't') && '0' || '1' }}
          PYTHONMALLOC: debug
        run: |
          uv run --no-sync python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import sys, sysconfig
          import orjson
          threaded = bool(sysconfig.get_config_var('Py_GIL_DISABLED'))
          assert getattr(sys, '_is_gil_enabled', lambda: True)() is not threaded
          def check(index):
              value = {'id': index, 'text': '雪\\\n' * 64, 'items': list(range(32))}
              assert orjson.loads(orjson.dumps(value)) == value
          with ThreadPoolExecutor(max_workers=8) as executor:
              list(executor.map(check, range(4096)))
          PY
          uv pip check --python .venv
          uv pip freeze --python .venv > dist/dependencies.txt
      - name: Upload tested wheel and evidence
        uses: actions/upload-artifact@v7
        with:
          name: orjson-${{ matrix.platform.label }}-cp${{ matrix.python }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
